# Gates `main`: static checks, migration drift, dependency audit, unit/integration tests on a real Postgres, and e2e.
# Holds no production secrets; the test job only uses the dummy values in .env.test.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # oxlint loads oxlint.config.ts with Node, which needs ≥ 22.18 to run TypeScript.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile

      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run knip

      - name: Migrations match the schema
        run: |
          bunx drizzle-kit check
          bunx drizzle-kit generate
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::src/db/schema.ts changed without a migration. Run 'bun run db:generate' and commit drizzle/."
            git status --porcelain drizzle
            exit 1
          fi

      # Ignored advisories don't reach the running app. Remove an entry once it's fixed upstream.
      #   GHSA-gcqx-w48m-w2h4 (low): deepmerge, only via the shadcn CLI; the app imports shadcn's CSS only. No fixed version.
      #   GHSA-67mh-4wv8-2f99 (moderate): esbuild dev server, via drizzle-kit's @esbuild-kit; drizzle-kit never serves.
      #   GHSA-g3hv-75wg-m249 (moderate): minimatch glob DoS, only via the shadcn CLI's ts-morph; the app never runs it.
      - name: Dependency audit
        run: bun audit --ignore=GHSA-gcqx-w48m-w2h4 --ignore=GHSA-67mh-4wv8-2f99 --ignore=GHSA-g3hv-75wg-m249

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pantau_bergizi_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    # Real env vars win over .env.test, which supplies the remaining dummy secrets.
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/pantau_bergizi_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/pantau_bergizi_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pantau_bergizi_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/pantau_bergizi_e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Playwright runner runs on Node; the app is built and served by `next` via Bun scripts.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: ./node_modules/.bin/playwright install --with-deps chromium
      # Migrates and resets the e2e DB, builds, starts, then runs the specs (see playwright.config.ts).
      - run: bun run e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
